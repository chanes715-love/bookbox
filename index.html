<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書箱資源查詢系統 - Book World</title>
    <!-- 使用 Tailwind CSS 進行樣式設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 使用 FontAwesome 載入圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入圓潤的英文字體與中文無襯線體 -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            /* 綜合英中字體，優先使用圓潤字體 */
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: #BDE4B3; /* 對應圖片的淺綠色背景 */
            position: relative;
            overflow-x: hidden; /* 防止背景裝飾溢出 */
            color: #3B5A3E; /* 預設文字為深綠色 */
        }

        /* 模擬圖片中的背景裝飾元素 */
        body::before, body::after {
            content: '';
            position: fixed;
            z-index: -1;
        }
        
        body::before {
            /* 左上角的不規則形狀 */
            top: -50px;
            left: -50px;
            width: 300px;
            height: 300px;
            background-color: #A3D299;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            transform: rotate(-20deg);
        }

        body::after {
            /* 右下角的幾何形狀 */
            bottom: -100px;
            right: -50px;
            width: 400px;
            height: 350px;
            background-color: #A3D299;
            clip-path: polygon(0 40%, 100% 0, 100% 100%, 30% 100%);
            opacity: 0.7;
        }

        /* 標題字體，使用特粗且圓潤的風格 */
        .title-text {
            font-family: 'Fredoka One', 'Noto Sans TC', cursive;
            color: #4A7A44; /* 深綠色主標題 */
            line-height: 0.9;
            text-transform: lowercase; /* 模擬原圖的 lowercase 感覺 */
        }

        .subtitle-text {
            color: #5C8C56;
            font-weight: 700;
        }

        .bookshelf-container {
            /* 將木櫃顏色改為較柔和、搭配綠色的原木色或深綠色系 */
            background-color: #7B5F42; 
            border: 12px solid #5C452F;
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 0 15px 30px rgba(74, 122, 68, 0.4);
            position: relative;
            padding: 20px 10px;
        }

        .shelf {
            border-bottom: 25px solid #5C452F;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            position: relative;
            margin-bottom: 40px;
            box-shadow: 0 10px 10px -5px rgba(0,0,0,0.4);
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            align-items: flex-end;
            padding: 0 15px 5px 15px;
            min-height: 180px; 
        }
        
        .shelf::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: -15px;
            right: -15px;
            height: 5px;
            background: rgba(255,255,255,0.05);
        }

        .book-item {
            width: 100%;
            max-width: 320px;
            margin: 10px;
            background-color: #FFFAED; /* 米白色書頁感 */
            border-radius: 6px;
            overflow: hidden;
            box-shadow: -4px 6px 12px rgba(0,0,0,0.25);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            position: relative;
            border-left: 18px solid #F4C430; /* 預設書背顏色 */
            z-index: 10;
        }

        .book-item:hover {
            transform: translateY(-15px) rotate(2deg);
            box-shadow: -8px 20px 25px rgba(0,0,0,0.3);
            z-index: 20;
        }

        /* 根據圖片色彩設定書籍書背顏色循環 (黃, 綠, 藍, 紅) */
        .book-item:nth-child(4n+1) { border-left-color: #F7B733; } /* 圖片中的黃色 */
        .book-item:nth-child(4n+2) { border-left-color: #6C9A64; } /* 圖片中的綠色 */
        .book-item:nth-child(4n+3) { border-left-color: #4B74B5; } /* 圖片中的藍色 */
        .book-item:nth-child(4n+4) { border-left-color: #CC4B40; } /* 圖片中的紅色 */

        /* 其他介面元素微調 */
        .search-input:focus {
            outline: 3px solid #F7B733;
        }

        .primary-btn {
            background-color: #F7B733; /* 主按鈕使用圖片黃色 */
            color: #4A7A44;
        }
        .primary-btn:hover {
            background-color: #FFC953;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(247, 183, 51, 0.4);
        }

        /* 讀取動畫 (改為綠色系) */
        .loader {
            border-top-color: #4A7A44;
            -webkit-animation: spinner 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            animation: spinner 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 塗鴉小裝飾 (使用 CSS 繪製簡單線條) */
        .doodle {
            position: absolute;
            z-index: -1;
            opacity: 0.6;
        }
        .doodle-1 { top: 15%; left: 10%; width: 50px; height: 50px; border-bottom: 4px solid #7EAD73; border-right: 4px solid transparent; border-radius: 50%; transform: rotate(30deg); }
        .doodle-2 { top: 70%; left: 5%; width: 60px; height: 20px; border-top: 4px wavy #7EAD73; }
        .doodle-3 { top: 20%; right: 25%; width: 40px; height: 40px; border: 4px solid #7EAD73; border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
        
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #D5EFCE; 
        }
        ::-webkit-scrollbar-thumb {
            background: #8EBA84; 
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6C9A64; 
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center relative">
    
    <!-- 裝飾用塗鴉 -->
    <div class="doodle doodle-1"></div>
    <div class="doodle doodle-3"></div>

    <header class="text-left mb-10 w-full max-w-5xl pl-4 md:pl-10 mt-8 relative z-10">
        <h1 class="title-text text-6xl md:text-8xl font-black mb-1 drop-shadow-md">
            book<br>world
        </h1>
        <p class="subtitle-text text-xl md:text-2xl mt-2 tracking-wide font-bold">Read, Learn, Grow</p>
    </header>

    <div class="w-full max-w-3xl mb-12 relative z-30">
        <form id="searchForm" class="relative flex items-center shadow-xl rounded-full overflow-hidden bg-white border-4 border-white focus-within:border-[#F7B733] transition-colors duration-300">
            <div class="pl-6 text-[#8EBA84]">
                <i class="fa-solid fa-magnifying-glass text-2xl"></i>
            </div>
            <input 
                type="text" 
                id="searchInput" 
                placeholder="輸入書箱登錄號 或 關鍵字..." 
                class="w-full py-5 px-5 text-xl text-[#3B5A3E] font-bold outline-none placeholder-[#A3D299] search-input bg-transparent"
            >
            <button 
                type="submit" 
                class="primary-btn font-black text-xl py-5 px-10 transition duration-300 ease-in-out focus:outline-none uppercase tracking-wider"
            >
                Search
            </button>
        </form>
    </div>

    <!-- 載入中指示器 -->
    <div id="loadingIndicator" class="hidden flex-col items-center justify-center my-8">
        <div class="loader ease-linear rounded-full border-8 border-t-8 border-[#BDE4B3] h-20 w-20 mb-4 shadow-lg"></div>
        <h2 class="text-center text-2xl font-black text-[#4A7A44]">Searching...</h2>
    </div>

    <!-- 結果訊息提示 -->
    <div id="resultMessage" class="text-center text-xl md:text-2xl text-[#4A7A44] font-bold mb-6 hidden w-full px-4 drop-shadow-sm"></div>

    <!-- 書櫃展示區 -->
    <div id="bookshelfContainer" class="w-full max-w-6xl bookshelf-container hidden z-20">
        <!-- 層板將由 JavaScript 動態生成 -->
    </div>

    <!-- 分頁控制區 -->
    <div id="paginationContainer" class="w-full max-w-4xl flex justify-center items-center mt-12 mb-16 hidden space-x-6 z-20">
        <button id="prevBtn" class="bg-[#CC4B40] hover:bg-[#A83D33] text-white font-bold py-3 px-8 rounded-full shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition duration-300 transform hover:-translate-y-1">
            <i class="fa-solid fa-chevron-left mr-2"></i> 上一頁
        </button>
        <span id="pageIndicator" class="text-[#4A7A44] font-black text-xl bg-white/60 px-6 py-2 rounded-full shadow-sm">第 1 頁 / 共 1 頁</span>
        <button id="nextBtn" class="bg-[#4B74B5] hover:bg-[#3B5B8E] text-white font-bold py-3 px-8 rounded-full shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition duration-300 transform hover:-translate-y-1">
            下一頁 <i class="fa-solid fa-chevron-right ml-2"></i>
        </button>
    </div>

    <!-- JavaScript 邏輯 (大部分維持，僅修改生成的卡片樣式) -->
    <script>
        // ==========================================
        // ★★★ 請將下方的網址替換為您的 GAS 網頁應用程式網址 ★★★
        // ==========================================
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbx5l9n76CWj_itIFSEkuQKs2rLjZt3kVvalJ_GfaUkS7LJmy664Ie8mtFYQ314YLpWh/exec'; 
        
        // DOM 元素宣告

            currentQuery = query;

            // 建立 API URL，附帶搜尋參數
            const url = `${GAS_URL}?action=search&query=${encodeURIComponent(query)}`;

            try {
                // 發送 GET 請求
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const result = await response.json();

                // 處理回應資料
                if (result.status === 'success') {
                    allResults = result.data;
                    
                    // 若是空查詢（一開始載入），則自動隨機打亂所有資料
                    if (query === '') {
                        shuffleArray(allResults);
                    }

                    currentPage = 1; // 重置頁碼為第 1 頁
                    renderPage();
                } else {
                    throw new Error(result.message || 'API 發生錯誤');
                }
            } catch (error) {
        // 監聽分頁按鈕 - 下一頁
        nextBtn.addEventListener('click', () => {
            const totalPages = Math.ceil(allResults.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderPage();
            }
        });

        /**
         * 隨機打亂陣列 (Fisher-Yates Shuffle 演算法)
         */
        function renderPage() {
            bookshelfContainer.innerHTML = ''; // 清空書櫃
            
            if (allResults.length === 0) {
                resultMessage.textContent = currentQuery ? `找不到包含「${currentQuery}」的書箱。` : '目前沒有任何書箱資料。';
                resultMessage.classList.remove('hidden');
                bookshelfContainer.classList.add('hidden');
                paginationContainer.classList.add('hidden');
                return;
            }

            // 計算分頁的開始與結束索引
            const totalPages = Math.ceil(allResults.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = allResults.slice(startIndex, endIndex); // 擷取當前頁的 10 筆資料

            // 更新上方的訊息文字
            if (currentQuery) {
                resultMessage.textContent = `找到 ${allResults.length} 個符合「${currentQuery}」的書箱 (顯示第 ${startIndex + 1}-${Math.min(endIndex, allResults.length)} 筆)：`;
            } else {
                resultMessage.textContent = `為您隨機推薦書箱 (共 ${allResults.length} 箱，顯示第 ${startIndex + 1}-${Math.min(endIndex, allResults.length)} 筆)：`;
            }
            resultMessage.classList.remove('hidden');
            bookshelfContainer.classList.remove('hidden');

            // 顯示與更新分頁控制區的狀態
            if (totalPages > 1) {
                paginationContainer.classList.remove('hidden');
                pageIndicator.textContent = `第 ${currentPage} 頁 / 共 ${totalPages} 頁`;
                prevBtn.disabled = currentPage === 1;
                nextBtn.disabled = currentPage === totalPages;
            } else {
                paginationContainer.classList.add('hidden'); // 若只有一頁則隱藏分頁列
            }

            // 渲染書櫃 (每層 3 本書的版面設計不變)
            const itemsPerShelf = 3; 
            let currentShelf = null;

            pageData.forEach((item, index) => {
                // 每 n 本書建立一個新的層板
                if (index % itemsPerShelf === 0) {
                    currentShelf = document.createElement('div');
                    currentShelf.className = 'shelf';
                    bookshelfContainer.appendChild(currentShelf);
                }

                // 建立書本 DOM
                const bookCard = createBookCard(item);
                currentShelf.appendChild(bookCard);
            });
        }

        /**
         * 建立單個書箱的卡片 DOM (更新風格)
         */
        function createBookCard(item) {
            const card = document.createElement('div');
            card.className = 'book-item flex flex-col justify-between';

            // 處理說明文字
            const noteText = (item.note && item.note.trim() !== "") ? item.note : "無特別說明";
            
            // 處理描述連結按鈕，採用圓潤風格
            let linkHtml = '<span class="text-gray-400 font-bold text-sm bg-gray-100 px-3 py-1 rounded-full">無連結</span>';
            if (item.descriptionLink && item.descriptionLink.trim() !== "") {
                linkHtml = `<a href="${item.descriptionLink}" target="_blank" class="inline-flex items-center text-white bg-[#6C9A64] hover:bg-[#4A7A44] transition-colors font-bold text-sm px-4 py-2 rounded-full shadow-sm hover:shadow-md transform hover:scale-105">
                                <i class="fa-solid fa-book-open mr-2"></i> 詳細內容
                            </a>`;
            }

            // 內部 HTML 結構更新
            card.innerHTML = `
                <div class="p-5 flex-grow">
                    <div class="flex justify-between items-start mb-3">
                        <span class="bg-[#FFFAED] text-[#3B5A3E] text-xs font-black px-3 py-1 rounded-full border-2 border-[#D5EFCE] font-sans tracking-widest shadow-sm">
                            # ${item.id}
                        </span>
                    </div>
                    <h3 class="text-2xl font-black text-[#3B5A3E] mt-1 mb-3 leading-tight line-clamp-2 font-['Nunito']" title="${item.name}">${item.name}</h3>
                    
                    <div class="text-sm text-[#5C8C56] mb-4 bg-white/60 p-3 rounded-lg border border-[#D5EFCE] h-24 overflow-y-auto font-medium shadow-inner">
                        ${noteText}
                    </div>
                </div>
                
                <div class="bg-[#F2E8D5]/50 p-4 border-t border-black/5 flex justify-between items-center rounded-b-md">
                    ${linkHtml}
                    <button onclick="copyToClipboard('${item.id}')" class="text-[#CC4B40] hover:text-white hover:bg-[#CC4B40] w-10 h-10 flex items-center justify-center rounded-full transition-all shadow-sm hover:shadow-md" title="複製登錄號">
                        <i class="fa-regular fa-copy text-lg"></i>
                    </button>
                </div>
            `;
            return card;
        }

        /**
         * 顯示錯誤訊息
         */
        function showError(msg) {
            resultMessage.textContent = msg;
            resultMessage.classList.remove('hidden');
            resultMessage.classList.add('text-red-600'); // 變更顏色為紅色
            bookshelfContainer.classList.add('hidden');
            paginationContainer.classList.add('hidden'); // 發生錯誤時隱藏分頁
        }

        /**
         * 複製文字到剪貼簿
         */
        function copyToClipboard(text) {
            // 使用較舊但也較廣泛支援的方法
            const textArea = document.createElement("textarea");
            textArea.value = text;
            
            // 避免網頁滾動
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";

            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if(successful) {
                    // 成功複製的提示
                    const originalText = resultMessage.innerHTML;
                    resultMessage.innerHTML = `<span class="text-[#CC4B40] bg-white px-6 py-2 rounded-full shadow-md"><i class="fa-solid fa-check-circle mr-2"></i>已複製: ${text}</span>`;
                    resultMessage.classList.remove('hidden');
                    setTimeout(() => {
                         resultMessage.innerHTML = originalText;
                    }, 2000);
                }
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
            }

            document.body.removeChild(textArea);
        }

        // 頁面載入時自動執行

        // 頁面載入時自動執行一次空查詢，列出所有書箱
        window.addEventListener('DOMContentLoaded', () => {
            if (GAS_URL !== '請貼上您的_GAS_Web_App_URL') {
                fetchData('');
            } else {
                 resultMessage.innerHTML = `<span class="text-red-500"><i class="fa-solid fa-triangle-exclamation mr-2"></i>請先在程式碼中設定 GAS 網址 (GAS_URL)</span>`;
                 resultMessage.classList.remove('hidden');
            }
        });

    </script>
</body>
</html>
